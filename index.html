<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi Estudio</title>
  <meta name="description" content="Calendario de exámenes y práctica con multiple choice, para estudiar desde el iPad.">

  <meta name="theme-color" content="#fff6fa">
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/icon-180.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mi Estudio">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="#" data-action="nav" data-view="hoy">
        <span class="brand-mark" aria-hidden="true">
          <img src="icons/logo-perla.png" alt="">
        </span>
        <span class="brand-text">
          <strong>Mi Estudio</strong>
          <small id="brand-sub">Calendario y práctica</small>
        </span>
      </a>
      <nav class="nav" aria-label="Secciones">
        <button type="button" data-action="nav" data-view="hoy">Hoy</button>
        <button type="button" data-action="nav" data-view="perla">My Perla</button>
        <button type="button" data-action="nav" data-view="horario">Horario</button>
        <button type="button" data-action="nav" data-view="calendario">Calendario</button>
        <button type="button" data-action="nav" data-view="planes">Planes</button>
        <button type="button" data-action="nav" data-view="materias">Materias</button>
        <button type="button" data-action="nav" data-view="apuntes">Apuntes</button>
        <button type="button" data-action="nav" data-view="practica">Práctica</button>
        <button type="button" data-action="nav" data-view="perfil" class="nav-avatar" aria-label="Perfil y logros">
          <span id="nav-avatar-initials">🙂</span>
          <i id="nav-avatar-level">1</i>
        </button>
      </nav>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <footer class="footer">
      <span id="footer-note">Tus datos se guardan en este dispositivo.</span>
    </footer>
  </div>

  <nav class="mobile-nav" aria-label="Secciones en el teléfono">
    <button type="button" data-action="nav" data-view="hoy"><span aria-hidden="true">🏠</span><small>Hoy</small></button>
    <button type="button" data-action="nav" data-view="perla"><span aria-hidden="true">🐆</span><small>Perla</small></button>
    <button type="button" data-action="nav" data-view="planes"><span aria-hidden="true">🗺️</span><small>Planes</small></button>
    <button type="button" data-action="nav" data-view="horario"><span aria-hidden="true">🕒</span><small>Horario</small></button>
    <button type="button" data-action="nav" data-view="calendario"><span aria-hidden="true">📅</span><small>Agenda</small></button>
    <button type="button" data-action="nav" data-view="materias"><span aria-hidden="true">📚</span><small>Materias</small></button>
    <button type="button" data-action="nav" data-view="apuntes"><span aria-hidden="true">📝</span><small>Apuntes</small></button>
    <button type="button" data-action="nav" data-view="practica"><span aria-hidden="true">🎯</span><small>Práctica</small></button>
    <button type="button" data-action="nav" data-view="perfil"><span aria-hidden="true">🙂</span><small>Perfil</small></button>
  </nav>

  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript>
    <p style="padding:24px;font-family:system-ui">Necesitás activar JavaScript para usar Mi Estudio.</p>
  </noscript>

  <script src="vendor/supabase.js" defer></script>
  <script type="module" src="app.js"></script>
</body>
</html>
